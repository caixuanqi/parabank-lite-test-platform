<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><title>ParaBank Lite — 转账</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;
       background:#f0f4f8; padding:30px; }
.card { background:#fff; border-radius:12px; padding:28px 32px;
        box-shadow:0 4px 20px rgba(0,0,0,0.08);
        max-width:820px; margin:0 auto; }
h1 { font-size:20px; margin-bottom:6px; color:#1a3d7c; }
.subtitle { font-size:13px; color:#909399; margin-bottom:20px; }
.topbar { display:flex; justify-content:space-between; align-items:center;
          margin-bottom:20px; padding-bottom:16px;
          border-bottom:1px solid #ebeef5; }
.topbar .user { font-size:13px; color:#606266; }
.topbar .user b { color:#1a3d7c; }
.topbar a { font-size:13px; color:#409eff; text-decoration:none; margin-left:14px; }
.field { margin-bottom:16px; }
.field label { display:block; font-size:13px; color:#606266;
               margin-bottom:6px; font-weight:500; }
.field input, .field select { width:100%; padding:10px 12px;
    border:1.5px solid #dcdfe6; border-radius:6px; font-size:14px;
    font-family:inherit; }
.field input:focus, .field select:focus { outline:none;
    border-color:#409eff; box-shadow:0 0 0 3px rgba(64,158,255,0.1); }
button { width:100%; padding:11px; background:#1a3d7c; color:#fff;
         border:none; border-radius:6px; font-size:14px; font-weight:600;
         cursor:pointer; font-family:inherit; }
button:hover { background:#153065; }
.msg { padding:10px 14px; border-radius:6px; font-size:13px;
       margin-bottom:16px; line-height:1.5; }
.msg.error { background:#fef0f0; color:#f56c6c; border:1px solid #fde2e2; }
.msg.success { background:#f0f9eb; color:#67c23a; border:1px solid #e1f3d8; }
</style></head>
<body>
<div class="card">
    <div class="topbar">
        <div class="user">欢迎，<b>{{ username }}</b></div>
        <div>
            <a href="/parabank/accounts">账户</a>
            <a href="/parabank/transactions">交易记录</a>
            <a href="/parabank/logout" id="btn-logout">退出</a>
        </div>
    </div>
    <h1>转账</h1>
    <p class="subtitle">在本行账户之间转账</p>
    {% if error %}<div class="msg error">{{ error }}</div>{% endif %}
    {% if success %}<div class="msg success">{{ success }}</div>{% endif %}
    <form method="post" action="/parabank/transfer">
        <div class="field">
            <label>源账户</label>
            <select name="from_account" id="from_account">
                {% for a in accounts %}
                <option value="{{ a.account_number }}">
                    {{ a.account_number }} (余额 ¥{{ "%.2f"|format(a.balance) }})
                </option>
                {% endfor %}
            </select>
        </div>
        <div class="field">
            <label>目标账户</label>
            <input type="text" name="to_account" id="to_account" placeholder="填账号数字，如 10002（账户 B）">
        </div>
        <div class="field">
            <label>转账金额（元）</label>
            <input type="text" name="amount" id="amount"
                   placeholder="0.01 ~ 50000.00，最多2位小数">
        </div>
        <button type="submit" id="btn-transfer">确认转账</button>
    </form>
</div>
</body></html>
